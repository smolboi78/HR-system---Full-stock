<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candidate Sign-Off Board</title>
<style>
  :root{
    --bg:#F5F6F4;
    --surface:#FFFFFF;
    --surface-2:#EFF1EE;
    --ink:#1C2321;
    --muted:#6B7570;
    --faint:#9AA19C;
    --brand:#2B4C5C;
    --brand-light:#3E6779;
    --brand-bg:#E7EDEF;
    --approve:#3A7D5C;
    --approve-bg:#E8F3EC;
    --reject:#B0503A;
    --reject-bg:#FBEBE6;
    --pending:#C48A2E;
    --pending-bg:#FBF3E3;
    --line:#DEE1DD;
    --line-strong:#C7CBC6;
    --radius:10px;
    --shadow: 0 1px 2px rgba(28,35,33,0.06), 0 4px 14px rgba(28,35,33,0.05);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .display{ font-family:'Space Grotesk',sans-serif; }
  .mono{ font-family:'IBM Plex Mono',monospace; letter-spacing:0.01em; }

  button{ font-family:inherit; cursor:pointer; }
  input,textarea,select{ font-family:inherit; }

  /* ---------- Shell ---------- */
  #app{ max-width: 920px; margin: 0 auto; padding: 0 16px 80px; }

  header.topbar{
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    padding:18px 0 12px;
    border-bottom:1px solid var(--line);
    margin-bottom:20px;
    display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .brand-block h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:20px; font-weight:700; margin:0 0 2px;
    letter-spacing:-0.01em;
  }
  .brand-block .sub{ font-size:12.5px; color:var(--muted); }
  .role-tag{
    font-size:11px; text-transform:uppercase; letter-spacing:0.08em;
    padding:4px 9px; border-radius:20px; font-weight:600;
    background:var(--brand); color:#fff;
  }
  .topbar-right{ display:flex; align-items:center; gap:10px; }
  .icon-btn{
    background:transparent; border:1px solid var(--line-strong); color:var(--muted);
    border-radius:8px; padding:6px 10px; font-size:12.5px; font-weight:600;
    display:flex; align-items:center; gap:6px;
  }
  .icon-btn:hover{ border-color:var(--brand); color:var(--brand); }
  .icon-btn:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:2px solid var(--brand); outline-offset:2px;
  }

  /* ---------- Role picker overlay ---------- */
  #rolePicker{
    position:fixed; inset:0; background:var(--bg); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .picker-card{ max-width:460px; width:100%; text-align:center; }
  .stamp-mark{
    width:64px; height:64px; margin:0 auto 20px; border-radius:50%;
    border:2.5px dashed var(--brand); display:flex; align-items:center; justify-content:center;
    color:var(--brand); transform:rotate(-6deg);
  }
  .picker-card h2{ font-family:'Space Grotesk',sans-serif; font-size:24px; margin:0 0 8px; }
  .picker-card p{ color:var(--muted); font-size:14px; margin:0 0 28px; line-height:1.5; }
  .picker-options{ display:flex; flex-direction:column; gap:12px; }
  .picker-btn{
    background:var(--surface); border:1.5px solid var(--line); border-radius:var(--radius);
    padding:18px 20px; text-align:left; display:flex; align-items:center; gap:14px;
    box-shadow:var(--shadow); transition:border-color .15s, transform .1s;
  }
  .picker-btn:hover{ border-color:var(--brand); transform:translateY(-1px); }
  .picker-btn .pb-icon{
    width:38px; height:38px; border-radius:8px; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:18px;
    background:var(--surface-2);
  }
  .picker-btn strong{ display:block; font-size:15px; margin-bottom:2px; }
  .picker-btn span{ font-size:12.5px; color:var(--muted); }

  /* ---------- Sections ---------- */
  .section-head{
    display:flex; align-items:baseline; justify-content:space-between; margin:28px 0 12px;
  }
  .section-head h3{ font-family:'Space Grotesk',sans-serif; font-size:15px; margin:0; }
  .section-head .count{ font-size:12px; color:var(--muted); }
  .section-head.decided h3{ color:var(--pending); }

  /* ---------- Reviewing view tabs ---------- */
  .ceo-tabs{ display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
  .ceo-tab-btn{
    background:var(--surface); border:1px solid var(--line-strong); border-radius:20px;
    padding:7px 14px; font-size:12.5px; font-weight:600; color:var(--muted);
    display:inline-flex; align-items:center; gap:7px;
  }
  .ceo-tab-btn:hover{ border-color:var(--brand); color:var(--brand); }
  .ceo-tab-btn.active{ background:var(--brand); border-color:var(--brand); color:#fff; }
  .ceo-tab-btn .tab-count{
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
    background:var(--surface-2); color:var(--muted); padding:1px 7px; border-radius:10px;
  }
  .ceo-tab-btn.active .tab-count{ background:rgba(255,255,255,0.25); color:#fff; }

  .sub-tabs{ display:flex; gap:6px; margin:-10px 0 18px; flex-wrap:wrap; }
  .sub-tab-btn{
    background:none; border:none; border-bottom:2px solid transparent;
    padding:6px 10px 8px; font-size:12.5px; font-weight:600; color:var(--muted);
  }
  .sub-tab-btn:hover{ color:var(--brand); }
  .sub-tab-btn.active{ color:var(--brand); border-bottom-color:var(--brand); }
  .sub-tab-btn .tab-count{
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; color:var(--faint); margin-left:4px;
  }

  .filter-bar{ display:flex; align-items:center; gap:8px; margin:-8px 0 16px; font-size:12.5px; color:var(--muted); }
  .filter-bar select{ width:auto; padding:6px 10px; font-size:12.5px; border:1px solid var(--line-strong); border-radius:7px; background:#fff; }

  .role-filter{ position:relative; margin:0 0 16px; }
  .role-filter-btn{
    background:#fff; border:1px solid var(--line-strong); border-radius:7px;
    padding:7px 12px; font-size:12.5px; font-weight:600; color:var(--ink);
    display:inline-flex; align-items:center; gap:6px;
  }
  .role-filter-btn:hover{ border-color:var(--brand); color:var(--brand); }
  .role-filter-panel{
    position:absolute; top:calc(100% + 6px); left:0; z-index:30;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:10px; min-width:230px; max-height:280px; overflow-y:auto;
  }
  .role-filter-actions{
    display:flex; justify-content:space-between; gap:8px; margin-bottom:8px;
    padding-bottom:8px; border-bottom:1px solid var(--surface-2);
  }
  .role-filter-mini{
    background:none; border:1px solid var(--line-strong); border-radius:6px; padding:5px 10px;
    font-size:11.5px; font-weight:600; color:var(--muted);
  }
  .role-filter-mini:hover{ border-color:var(--brand); color:var(--brand); }
  .role-filter-option{
    display:flex; align-items:center; gap:8px; font-size:13px; padding:5px 2px; cursor:pointer;
  }
  .role-filter-option input{ width:auto; }

  /* ---------- Add candidate form ---------- */
  .panel{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; box-shadow:var(--shadow); margin-bottom:8px;
  }
  .panel h2{ font-family:'Space Grotesk',sans-serif; font-size:16px; margin:0 0 16px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
  @media(max-width:560px){ .field-row{ grid-template-columns:1fr; } }
  label{ display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.03em; }
  input[type=text], input[type=file], textarea, select{
    width:100%; border:1px solid var(--line-strong); border-radius:8px; padding:9px 11px;
    font-size:14px; background:#fff; color:var(--ink);
  }
  textarea{ resize:vertical; min-height:64px; }
  .field{ margin-bottom:12px; }
  .hint{ font-size:11.5px; color:var(--faint); margin-top:4px; }

  .score-picker{ display:flex; gap:6px; }
  .score-dot{
    width:34px; height:34px; border-radius:8px; border:1.5px solid var(--line-strong);
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700;
    color:var(--muted); background:#fff;
  }
  .score-dot.active{ background:var(--brand); border-color:var(--brand); color:#fff; }

  .criteria-row{ display:grid; grid-template-columns:1fr 140px 30px; gap:8px; margin-bottom:8px; align-items:center; }
  @media(max-width:560px){ .criteria-row{ grid-template-columns:1fr 1fr auto; } }
  .row-remove{ background:none; border:none; color:var(--faint); font-size:18px; line-height:1; padding:4px; }
  .row-remove:hover{ color:var(--reject); }
  .add-row-btn{
    background:none; border:1px dashed var(--line-strong); border-radius:8px; padding:8px 12px;
    font-size:12.5px; font-weight:600; color:var(--muted); width:100%; margin-top:2px;
  }
  .add-row-btn:hover{ border-color:var(--brand); color:var(--brand); }

  .primary-btn{
    background:var(--brand); color:#fff; border:none; border-radius:8px;
    padding:11px 20px; font-size:13.5px; font-weight:700; letter-spacing:0.01em;
  }
  .primary-btn:hover{ background:var(--brand-light); }
  .primary-btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .ghost-btn{
    background:none; border:1px solid var(--line-strong); border-radius:8px;
    padding:10px 16px; font-size:13px; font-weight:600; color:var(--ink);
  }
  .ghost-btn:hover{ border-color:var(--ink); }

  .form-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:6px; }
  .form-msg{ font-size:12.5px; margin-top:10px; padding:8px 10px; border-radius:6px; }
  .form-msg.error{ background:var(--reject-bg); color:var(--reject); }
  .form-msg.ok{ background:var(--approve-bg); color:var(--approve); }

  /* ---------- Role group ---------- */
  .role-group{ margin-bottom:24px; }
  .role-group-title{
    display:flex; align-items:center; gap:8px; margin-bottom:10px;
  }
  .role-group-title .rg-name{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14.5px; color:var(--brand); }
  .role-group-title .rg-line{ flex:1; height:1px; background:var(--line); }
  .role-group-title .rg-count{ font-size:11.5px; color:var(--muted); }

  /* ---------- Candidate card ---------- */
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px; margin-bottom:12px; box-shadow:var(--shadow); position:relative;
  }
  .card.status-pending{ border-left:3px solid var(--pending); }
  .card.status-approved{ border-left:3px solid var(--approve); }
  .card.status-rejected{ border-left:3px solid var(--reject); }

  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px; }
  .card-name{ font-size:16px; font-weight:700; }
  .card-meta{ font-size:11.5px; color:var(--faint); margin-top:2px; }
  .score-badge{
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12.5px;
    background:var(--surface-2); padding:4px 9px; border-radius:6px; flex:none; white-space:nowrap;
  }

  .card-notes{ font-size:13.5px; color:var(--ink); line-height:1.5; margin:8px 0; white-space:pre-wrap; }

  .criteria-list{ margin:10px 0; }
  .criteria-item{
    display:flex; justify-content:space-between; gap:10px; align-items:center;
    padding:6px 0; border-bottom:1px solid var(--surface-2); font-size:13px;
  }
  .criteria-item:last-child{ border-bottom:none; }
  .verdict-tag{
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;
    padding:2px 8px; border-radius:20px; flex:none;
  }
  .verdict-meets{ background:var(--approve-bg); color:var(--approve); }
  .verdict-partial{ background:var(--pending-bg); color:var(--pending); }
  .verdict-no{ background:var(--reject-bg); color:var(--reject); }

  .card-bottom{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; flex-wrap:wrap; }
  .cv-btn{
    display:inline-flex; align-items:center; gap:6px; background:var(--surface-2); border:none;
    border-radius:7px; padding:7px 12px; font-size:12.5px; font-weight:600; color:var(--ink);
  }
  .cv-btn:hover{ background:var(--line); }
  .cv-link-text{ font-size:12px; color:var(--brand-light); word-break:break-all; }

  .decision-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .approve-btn, .reject-btn, .hold-btn{
    border:none; border-radius:7px; padding:8px 16px; font-size:12.5px; font-weight:700; color:#fff;
  }
  .approve-btn{ background:var(--approve); }
  .approve-btn:hover{ background:#2E6349; }
  .reject-btn{ background:var(--reject); }
  .reject-btn:hover{ background:#93412F; }
  .hold-btn{ background:var(--pending); }
  .hold-btn:hover{ background:#A97723; }

  .hold-tag{
    display:inline-block; margin-top:4px; margin-right:6px;
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;
    padding:2px 9px; border-radius:20px;
    background:var(--pending-bg); color:var(--pending);
  }
  .headhunt-tag{
    display:inline-block; margin-top:4px; margin-right:6px;
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;
    padding:2px 9px; border-radius:20px;
    background:var(--brand-bg); color:var(--brand);
  }
  .company-line{ font-size:12.5px; color:var(--muted); margin:6px 0 0; }
  .company-line strong{ color:var(--ink); font-weight:600; }

  .reject-reason-tag{
    display:inline-block; margin-top:4px; margin-right:6px;
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;
    padding:2px 9px; border-radius:20px;
    background:var(--reject-bg); color:var(--reject);
  }

  .stage-panel{
    background:var(--surface-2); border-radius:8px; padding:12px 14px; margin:10px 0;
  }
  .stage-panel .field-row, .stage-panel .field{ margin-bottom:10px; }
  .stage-panel .field:last-child, .stage-panel .field-row:last-child{ margin-bottom:0; }
  .checkbox-row{ display:flex; align-items:center; gap:8px; font-size:13px; }
  .checkbox-row input{ width:auto; }
  .stage-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .back-link{
    background:none; border:none; color:var(--muted); font-size:12px; font-weight:600;
    text-decoration:underline; padding:4px 0;
  }
  .back-link:hover{ color:var(--brand); }

  .source-toggle{ display:flex; gap:8px; }
  .source-btn{
    background:#fff; border:1.5px solid var(--line-strong); border-radius:8px;
    padding:9px 14px; font-size:13px; font-weight:600; color:var(--muted);
  }
  .source-btn:hover{ border-color:var(--brand); color:var(--brand); }
  .source-btn.active{ background:var(--brand); border-color:var(--brand); color:#fff; }

  .linkedin-btn{
    display:inline-flex; align-items:center; gap:6px; background:var(--brand-bg); border:none;
    border-radius:7px; padding:7px 12px; font-size:12.5px; font-weight:600; color:var(--brand);
  }
  .linkedin-btn:hover{ background:#D9E2E5; }

  .reject-note{
    width:100%; margin-top:8px; display:none;
  }
  .reject-note.show{ display:block; }
  .reject-note textarea{ min-height:44px; }
  .reject-note .mini-actions{ display:flex; gap:8px; margin-top:6px; flex-wrap:wrap; }
  .mini-confirm{ background:var(--reject); color:#fff; border:none; border-radius:6px; padding:6px 12px; font-size:12px; font-weight:700; }
  .mini-confirm.hold{ background:var(--pending); }
  .mini-cancel{ background:none; border:1px solid var(--line-strong); border-radius:6px; padding:6px 12px; font-size:12px; }

  /* decided stamp */
  .decision-stamp{
    position:absolute; top:-10px; right:18px;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:11px;
    letter-spacing:0.08em; text-transform:uppercase;
    border:2px solid; border-radius:6px; padding:4px 10px;
    transform:rotate(4deg);
    background:var(--surface);
  }
  .decision-stamp.approved{ color:var(--approve); border-color:var(--approve); }
  .decision-stamp.rejected{ color:var(--reject); border-color:var(--reject); }
  .decision-comment{
    font-size:12.5px; color:var(--muted); background:var(--surface-2); border-radius:7px;
    padding:8px 10px; margin-top:8px; font-style:italic;
  }
  .handled-btn{
    background:none; border:1px solid var(--line-strong); border-radius:7px; padding:7px 13px;
    font-size:12px; font-weight:600; color:var(--muted);
  }
  .handled-btn:hover{ border-color:var(--brand); color:var(--brand); }

  /* ---------- Empty state ---------- */
  .empty-state{
    text-align:center; padding:44px 20px; color:var(--faint);
  }
  .empty-state .es-mark{ font-size:28px; margin-bottom:10px; }
  .empty-state p{ font-size:13.5px; margin:0; }

  .loading-row{ text-align:center; padding:30px; color:var(--faint); font-size:13px; }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:8px;
    font-size:13px; z-index:200; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
    box-shadow:0 6px 18px rgba(0,0,0,0.2);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>

<div id="rolePicker">
  <div class="picker-card">
    <div class="stamp-mark">✓</div>
    <h2>Candidate Sign-Off Board</h2>
    <p>Who's viewing this board on this device? You can switch anytime from the top bar.</p>
    <div class="picker-options">
      <button class="picker-btn" onclick="setRole('hr')">
        <div class="pb-icon">📋</div>
        <div><strong>I'm screening candidates</strong><span>Add candidates, attach CVs, track decisions</span></div>
      </button>
      <button class="picker-btn" onclick="setRole('ceo')">
        <div class="pb-icon">✓</div>
        <div><strong>I'm reviewing candidates</strong><span>See who's waiting and approve or reject</span></div>
      </button>
    </div>
  </div>
</div>

<div id="app" style="display:none;">
  <header class="topbar">
    <div class="brand-block">
      <h1>Candidate Sign-Off Board</h1>
      <div class="sub" id="headerSub">Loading…</div>
    </div>
    <div class="topbar-right">
      <span class="role-tag" id="roleTag">—</span>
      <button class="icon-btn" onclick="manualRefresh()">↻ Refresh</button>
      <button class="icon-btn" onclick="openPicker()">Switch view</button>
    </div>
  </header>

  <div id="hrAddPanel"></div>
  <div id="boardRoot"><div class="loading-row">Loading candidates…</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ State ============ */
let currentRole = null;          // 'hr' | 'ceo'
let candidates = [];             // array of meta objects
let pollTimer = null;
let criteriaRowCount = 0;
let currentScore = 0;
let currentSource = 'applied';   // 'applied' | 'headhunting' — for the Add form
let editingId = null;            // candidate id currently open in the edit form, or null
const editScores = {};           // per-candidate score while editing
const editCriteriaCount = {};    // per-candidate criteria row counter while editing
const editSources = {};          // per-candidate source ('applied'|'headhunting') while editing
// Shared by both roles — HR and CEO now navigate the identical funnel tab structure,
// just with different action permissions per section (see renderFunnelTabs).
let activeMainTab = 'screening';      // 'screening' | 'approved' | 'messaged' | 'scheduled' | 'shortlisted' | 'archived'
let activeScreeningSub = 'jobpost';   // 'jobpost' | 'linkedin'
let activeArchivedSub = 'rejected';   // 'rejected' | 'notfit' | 'hold' | 'closed'
let activeFilter = 'all';             // meaning depends on which tab is active
const activeRoleFilters = new Set();  // job titles to show; empty set = show all
let roleFilterPanelOpen = false;

/* ============ Utilities ============ */
function escapeHtml(str){
  if(str===undefined || str===null) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function daysAgo(iso){
  const d = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if(d <= 0) return 'today';
  if(d === 1) return '1 day waiting';
  return d + ' days waiting';
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}

/* ============ Role handling ============ */
function loadRole(){
  const stored = localStorage.getItem('csb-ui-role');
  if(stored === 'hr' || stored === 'ceo'){
    currentRole = stored;
    enterApp();
    return;
  }
  openPicker();
}
function openPicker(){
  document.getElementById('rolePicker').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}
function setRole(role){
  currentRole = role;
  try{ localStorage.setItem('csb-ui-role', role); }catch(e){ /* ignore, still proceed */ }
  enterApp();
}
function enterApp(){
  document.getElementById('rolePicker').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('roleTag').textContent = currentRole === 'hr' ? 'Screening' : 'Reviewing';
  document.getElementById('headerSub').textContent = currentRole === 'hr'
    ? 'Add screened candidates and track sign-off status'
    : 'Decide on screening and on-hold candidates, and track the full funnel';
  if(currentRole === 'hr'){ renderAddPanel(); } else { document.getElementById('hrAddPanel').innerHTML = ''; }
  loadCandidates();
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(autoRefresh, 20000);
}
function manualRefresh(){ loadCandidates(true); }

// True while the user is actively typing into a reject/hold/reviewer notes box —
// a passive refresh here would wipe out whatever they haven't saved yet.
function isTypingInNoteBox(){
  const el = document.activeElement;
  if(!el) return false;
  if(el.tagName === 'TEXTAREA'){
    return el.id.startsWith('rn-text-') || el.id.startsWith('hn-text-') || el.id.startsWith('rev-notes-')
      || el.id.startsWith('irn-text-') || el.id.startsWith('sc-summary-') || el.id.startsWith('nfm-text-');
  }
  if(el.tagName === 'INPUT'){
    return el.id.startsWith('iv-dt-') || el.id.startsWith('sc-by-');
  }
  return false;
}

function autoRefresh(){
  if(editingId || isTypingInNoteBox()) return;
  loadCandidates();
}

/* ============ Loading candidates ============ */
async function loadCandidates(isManual){
  try{
    const res = await fetch('/candidates');
    if(!res.ok) throw new Error('Request failed: ' + res.status);
    const data = await res.json();
    data.sort((a,b) => new Date(a.dateAdded) - new Date(b.dateAdded));
    candidates = data;
    renderBoard();
    if(isManual) showToast('Board updated');
  }catch(e){
    document.getElementById('boardRoot').innerHTML =
      '<div class="empty-state"><div class="es-mark">⚠</div><p>Could not load the board right now. Try refresh.</p></div>';
  }
}

/* ============ Rendering ============ */
function renderBoard(){
  document.getElementById('boardRoot').innerHTML = renderFunnelTabs();
}

function renderMainTabBar(tabs, activeKey, onClickFn){
  let html = `<div class="ceo-tabs">`;
  tabs.forEach(t => {
    html += `<button class="ceo-tab-btn${activeKey === t.key ? ' active' : ''}" onclick="${onClickFn}('${t.key}')">${t.label}<span class="tab-count">${t.count}</span></button>`;
  });
  html += `</div>`;
  return html;
}

function renderSubTabBar(tabs, activeKey, onClickFn){
  let html = `<div class="sub-tabs">`;
  tabs.forEach(t => {
    html += `<button class="sub-tab-btn${activeKey === t.key ? ' active' : ''}" onclick="${onClickFn}('${t.key}')">${t.label}<span class="tab-count">${t.list.length}</span></button>`;
  });
  html += `</div>`;
  return html;
}

function renderFilterBar(options, activeValue, onChangeFn){
  return `<div class="filter-bar">
    <label for="filterSelect" style="margin:0;text-transform:none;font-weight:600;letter-spacing:0;">Filter</label>
    <select id="filterSelect" onchange="${onChangeFn}(this.value)">
      ${options.map(o => `<option value="${o.value}"${o.value===activeValue?' selected':''}>${escapeHtml(o.label)}</option>`).join('')}
    </select>
  </div>`;
}

function renderRoleFilterBar(allRoles){
  if(!allRoles.length) return '';
  const label = activeRoleFilters.size
    ? `${activeRoleFilters.size} job title${activeRoleFilters.size > 1 ? 's' : ''} selected`
    : 'All job titles';
  let html = `<div class="role-filter">
    <button type="button" class="role-filter-btn" onclick="toggleRoleFilterPanel()">▾ ${escapeHtml(label)}</button>`;
  if(roleFilterPanelOpen){
    html += `<div class="role-filter-panel">
      <div class="role-filter-actions">
        <button type="button" class="role-filter-mini" onclick="clearRoleFilter()">All job titles</button>
        <button type="button" class="role-filter-mini" onclick="closeRoleFilterPanel()">Done</button>
      </div>
      ${allRoles.map(r => `
        <label class="role-filter-option">
          <input type="checkbox" data-role="${escapeHtml(r)}" ${activeRoleFilters.has(r) ? 'checked' : ''} onchange="toggleRoleFilter(this.dataset.role, this.checked)">
          <span>${escapeHtml(r)}</span>
        </label>`).join('')}
    </div>`;
  }
  html += `</div>`;
  return html;
}

function toggleRoleFilterPanel(){
  roleFilterPanelOpen = !roleFilterPanelOpen;
  renderBoard();
}
function closeRoleFilterPanel(){
  roleFilterPanelOpen = false;
  renderBoard();
}
function toggleRoleFilter(role, checked){
  if(checked) activeRoleFilters.add(role); else activeRoleFilters.delete(role);
  renderBoard();
}
function clearRoleFilter(){
  activeRoleFilters.clear();
  renderBoard();
}

function renderFunnelTabs(){
  const isCeo = currentRole === 'ceo';
  const allRoles = [...new Set(candidates.map(c => c.role).filter(Boolean))].sort();
  const pool = activeRoleFilters.size ? candidates.filter(c => activeRoleFilters.has(c.role)) : candidates;
  const screeningSub = [
    { key:'jobpost', label:'Job Post Applicants', list: pool.filter(c => c.status === 'pending' && !c.onHold && c.source !== 'headhunting') },
    { key:'linkedin', label:'LinkedIn Headhunting', list: pool.filter(c => c.status === 'pending' && !c.onHold && c.source === 'headhunting') },
  ];
  const approvedList = pool.filter(c => c.status === 'approved' && c.stage === 'approved' && !c.archived);
  const messagedList = pool.filter(c => c.status === 'approved' && c.stage === 'messaged' && !c.archived);
  const scheduledList = pool.filter(c => c.status === 'approved' && c.stage === 'scheduled' && !c.archived);
  const shortlistedList = pool.filter(c => c.status === 'approved' && c.stage === 'shortlisted' && !c.archived);
  const archivedSub = [
    { key:'rejected', label:'Rejected', list: pool.filter(c => c.status === 'rejected' && c.rejectionReason !== 'not_fit_after_messaging') },
    { key:'notfit', label:'Not a Fit (LinkedIn)', list: pool.filter(c => c.status === 'rejected' && c.rejectionReason === 'not_fit_after_messaging') },
    { key:'hold', label:'On Hold', list: pool.filter(c => c.status === 'pending' && c.onHold) },
    { key:'closed', label:'Closed', list: pool.filter(c => c.status === 'approved' && c.archived) },
  ];

  const mainTabs = [
    { key:'screening', label:'Initial Screening (HR)', count: screeningSub[0].list.length + screeningSub[1].list.length },
    { key:'approved', label:'Approved for Interview', count: approvedList.length },
    { key:'messaged', label:'Messaged on LinkedIn', count: messagedList.length },
    { key:'scheduled', label:'Scheduled for Interview', count: scheduledList.length },
    { key:'shortlisted', label:'Interviewed & Shortlisted', count: shortlistedList.length },
    { key:'archived', label:'Archived', count: archivedSub.reduce((sum, t) => sum + t.list.length, 0) },
  ];

  let html = renderRoleFilterBar(allRoles);
  html += renderMainTabBar(mainTabs, activeMainTab, 'setMainTab');

  if(activeMainTab === 'screening'){
    html += renderSubTabBar(screeningSub, activeScreeningSub, 'setScreeningSub');
    const active = screeningSub.find(t => t.key === activeScreeningSub) || screeningSub[0];
    const emptyMsg = active.key === 'jobpost'
      ? (isCeo ? 'Nothing waiting on you right now.' : 'No candidates waiting on the reviewer right now.')
      : 'No headhunting candidates yet.';
    html += renderGrouped(active.list, isCeo, emptyMsg);
  }else if(activeMainTab === 'approved'){
    html += renderGrouped(approvedList, false, 'No one approved for interview yet.');
  }else if(activeMainTab === 'messaged'){
    html += renderGrouped(messagedList, false, 'No one messaged on LinkedIn yet.');
  }else if(activeMainTab === 'scheduled'){
    html += renderFilterBar([
      { value:'all', label:'All' },
      { value:'confirmed', label:'Confirmed' },
      { value:'unconfirmed', label:'Not confirmed yet' },
    ], activeFilter, 'setActiveFilter');
    let list = scheduledList;
    if(activeFilter === 'confirmed') list = list.filter(c => c.interviewConfirmed);
    if(activeFilter === 'unconfirmed') list = list.filter(c => !c.interviewConfirmed);
    html += renderGrouped(list, false, 'No interviews scheduled yet.');
  }else if(activeMainTab === 'shortlisted'){
    html += renderGrouped(shortlistedList, false, 'No one has been interviewed yet.');
  }else if(activeMainTab === 'archived'){
    html += renderSubTabBar(archivedSub, activeArchivedSub, 'setArchivedSub');
    const active = archivedSub.find(t => t.key === activeArchivedSub) || archivedSub[0];
    let list = active.list;
    let emptyMessage = { rejected:'No rejected candidates yet.', notfit:'No LinkedIn candidates marked not a fit yet.', hold:'No candidates on hold.', closed:'Nothing closed yet.' }[active.key];
    if(active.key === 'rejected'){
      html += renderFilterBar([
        { value:'all', label:'All reasons' },
        { value:'after_second_screening', label:'Rejected after second screening' },
        { value:'after_interview', label:'Rejected after interview' },
      ], activeFilter, 'setActiveFilter');
      if(activeFilter !== 'all') list = list.filter(c => c.rejectionReason === activeFilter);
    }
    // Only the CEO gets decision actions here, and only on the On Hold sub-tab —
    // every other archived bucket (rejected, not-a-fit, closed) is a terminal,
    // read-only view for both roles.
    html += renderGrouped(list, isCeo && active.key === 'hold', emptyMessage);
  }
  return html;
}

function setMainTab(key){
  activeMainTab = key;
  activeFilter = 'all';
  renderBoard();
}
function setScreeningSub(key){
  activeScreeningSub = key;
  renderBoard();
}
function setArchivedSub(key){
  activeArchivedSub = key;
  activeFilter = 'all';
  renderBoard();
}
function setActiveFilter(value){
  activeFilter = value;
  renderBoard();
}

function renderGrouped(list, ceoActions, emptyMessage){
  if(!list.length){
    const msg = emptyMessage || (ceoActions ? "Nothing waiting on you right now." : "No candidates here yet.");
    return `<div class="empty-state"><div class="es-mark">${ceoActions ? '✓' : '—'}</div><p>${msg}</p></div>`;
  }
  const groups = {};
  list.forEach(c => {
    const role = c.role || 'Unspecified role';
    if(!groups[role]) groups[role] = [];
    groups[role].push(c);
  });
  let out = '';
  Object.keys(groups).sort().forEach(role => {
    out += `<div class="role-group">
      <div class="role-group-title">
        <span class="rg-name">${escapeHtml(role)}</span>
        <span class="rg-line"></span>
        <span class="rg-count">${groups[role].length}</span>
      </div>
      ${groups[role].map(c => renderCard(c, ceoActions)).join('')}
    </div>`;
  });
  return out;
}

function renderCard(c, ceoActions){
  const criteriaHtml = (c.criteria || []).map(row => {
    const cls = row.verdict === 'Meets' ? 'verdict-meets' : (row.verdict === 'Partial' ? 'verdict-partial' : 'verdict-no');
    return `<div class="criteria-item"><span>${escapeHtml(row.q)}</span><span class="verdict-tag ${cls}">${escapeHtml(row.verdict||'—')}</span></div>`;
  }).join('');

  const cvBtn = c.hasCv
    ? `<button class="cv-btn" onclick="viewCv('${c.id}')">📄 View CV${c.cvFileName ? ' — ' + escapeHtml(c.cvFileName) : ''}</button>`
    : (c.cvLink ? `<a class="cv-link-text" href="${escapeHtml(c.cvLink)}" target="_blank" rel="noopener">🔗 ${escapeHtml(c.cvLink)}</a>` : '<span class="hint">No CV attached</span>');

  const linkedinBtn = c.linkedinUrl
    ? `<a class="linkedin-btn" href="${escapeHtml(c.linkedinUrl)}" target="_blank" rel="noopener">🔗 LinkedIn profile</a>`
    : '';

  let bottom = `<div class="card-bottom"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">${cvBtn}${linkedinBtn}</div>`;
  if(ceoActions){
    bottom += `<div class="decision-actions">
      <button class="approve-btn" onclick="decide('${c.id}','approved')">Approve</button>
      <button class="hold-btn" onclick="toggleHoldNote('${c.id}')">${c.onHold ? 'Update hold' : 'On hold'}</button>
      <button class="reject-btn" onclick="toggleRejectNote('${c.id}')">Reject</button>
    </div>`;
  }
  if(currentRole === 'hr' && c.archived){
    bottom += `<button class="handled-btn" onclick="restoreCandidate('${c.id}')">Restore</button>`;
    bottom += `<button class="reject-btn" onclick="toggleDeleteConfirm('${c.id}')">Delete permanently</button>`;
  }else{
    if(currentRole === 'hr'){
      bottom += `<button class="handled-btn" onclick="toggleEdit('${c.id}')">${editingId === c.id ? 'Cancel edit' : 'Edit'}</button>`;
    }
    if(currentRole === 'hr' && c.status === 'approved'){
      bottom += `<button class="handled-btn" onclick="archiveCandidate('${c.id}')">Mark handled — archive</button>`;
    }
  }
  bottom += `</div>`;

  let rejectNoteBlock = '';
  if(ceoActions){
    rejectNoteBlock = `<div class="reject-note" id="rn-${c.id}">
      <textarea id="rn-text-${c.id}" placeholder="Optional reason (helps HR)"></textarea>
      <div class="mini-actions">
        <button class="mini-confirm" onclick="decide('${c.id}','rejected')">Confirm reject</button>
        <button class="mini-cancel" onclick="toggleRejectNote('${c.id}')">Cancel</button>
      </div>
    </div>`;
  }

  let holdNoteBlock = '';
  if(ceoActions){
    holdNoteBlock = `<div class="reject-note" id="hn-${c.id}">
      <textarea id="hn-text-${c.id}" placeholder="Optional note about why this is on hold">${escapeHtml(c.holdNote || '')}</textarea>
      <div class="mini-actions">
        <button class="mini-confirm hold" onclick="confirmHold('${c.id}')">${c.onHold ? 'Update hold' : 'Confirm hold'}</button>
        <button class="mini-cancel" onclick="toggleHoldNote('${c.id}')">Cancel</button>
        ${c.onHold ? `<button class="mini-cancel" onclick="removeHold('${c.id}')">Remove hold</button>` : ''}
      </div>
    </div>`;
  }

  let reviewNotesBlock = '';
  if(ceoActions){
    reviewNotesBlock = `<div class="field" style="margin-top:10px;">
      <label for="rev-notes-${c.id}">Your notes (optional)</label>
      <textarea id="rev-notes-${c.id}" placeholder="Private notes for this candidate — not shown as a decision reason">${escapeHtml(c.reviewNotes || '')}</textarea>
      <div class="mini-actions">
        <button class="mini-cancel" onclick="saveReviewNotes('${c.id}')">Save note</button>
      </div>
    </div>`;
  }else if(c.reviewNotes){
    reviewNotesBlock = `<div class="decision-comment">Reviewer notes: "${escapeHtml(c.reviewNotes)}"</div>`;
  }

  let deleteConfirmBlock = '';
  if(currentRole === 'hr' && c.archived){
    deleteConfirmBlock = `<div class="reject-note" id="dc-${c.id}">
      <p style="font-size:12.5px;color:var(--reject);margin:0 0 8px;">This permanently deletes the candidate and their CV — it cannot be undone.</p>
      <div class="mini-actions">
        <button class="mini-confirm" onclick="permanentlyDelete('${c.id}')">Yes, delete permanently</button>
        <button class="mini-cancel" onclick="toggleDeleteConfirm('${c.id}')">Cancel</button>
      </div>
    </div>`;
  }

  const holdTag = c.onHold ? `<span class="hold-tag">On hold</span>` : '';
  const headhuntTag = c.source === 'headhunting' ? `<span class="headhunt-tag">LinkedIn headhunting</span>` : '';
  const rejectReasonTag = (c.status === 'rejected' && c.rejectionReason)
    ? `<span class="reject-reason-tag">${escapeHtml(rejectionReasonLabel(c.rejectionReason))}</span>`
    : '';
  const holdNoteDisplay = (!ceoActions && c.onHold && c.holdNote)
    ? `<div class="decision-comment">On hold: "${escapeHtml(c.holdNote)}"</div>`
    : '';
  const companyLine = (c.source === 'headhunting' && c.company)
    ? `<div class="company-line">Coming from <strong>${escapeHtml(c.company)}</strong></div>`
    : '';

  let stamp = '';
  let decisionComment = '';
  if(c.status === 'approved'){
    const stageLabel = { approved:'Approved', messaged:'Messaged', scheduled:'Scheduled', shortlisted:'Shortlisted' }[c.stage] || 'Approved';
    stamp = `<div class="decision-stamp approved">${stageLabel}</div>`;
  }else if(c.status === 'rejected'){
    stamp = `<div class="decision-stamp rejected">Rejected</div>`;
    if(c.decision && c.decision.comment){
      decisionComment = `<div class="decision-comment">"${escapeHtml(c.decision.comment)}"</div>`;
    }
  }

  const editBlock = (currentRole === 'hr' && editingId === c.id) ? renderEditForm(c) : '';
  const stagePanel = renderStagePanel(c);

  return `<div class="card status-${c.status}">
    ${stamp}
    <div class="card-top">
      <div>
        <div class="card-name">${escapeHtml(c.name)}</div>
        <div class="card-meta">${daysAgo(c.dateAdded)}${c.status !== 'pending' ? ' · decided ' + (c.decision && c.decision.decidedAt ? new Date(c.decision.decidedAt).toLocaleDateString() : '') : ''}</div>
        ${companyLine}
        ${headhuntTag}${holdTag}${rejectReasonTag}
      </div>
      ${c.score ? `<div class="score-badge">${c.score}/5</div>` : ''}
    </div>
    ${c.notes ? `<div class="card-notes">${escapeHtml(c.notes)}</div>` : ''}
    ${criteriaHtml ? `<div class="criteria-list">${criteriaHtml}</div>` : ''}
    ${decisionComment}
    ${holdNoteDisplay}
    ${reviewNotesBlock}
    ${stagePanel}
    ${bottom}
    ${rejectNoteBlock}
    ${holdNoteBlock}
    ${deleteConfirmBlock}
    ${editBlock}
  </div>`;
}

function rejectionReasonLabel(r){
  if(r === 'after_interview') return 'Rejected after interview';
  if(r === 'after_second_screening') return 'Rejected after second screening';
  if(r === 'not_fit_after_messaging') return 'Not a fit after messaging';
  return 'Rejected';
}

function renderStagePanel(c){
  if(currentRole !== 'hr' || c.archived || c.status !== 'approved') return '';
  const stage = c.stage || 'approved';
  let html = `<div class="stage-panel">
    <div class="field">
      <label for="stage-move-${c.id}">Funnel stage</label>
      <select id="stage-move-${c.id}" onchange="onFunnelStageSelect('${c.id}', this.value)">
        <option value="approved"${stage==='approved'?' selected':''}>Approved for Interview</option>
        ${(c.source === 'headhunting' || stage === 'messaged') ? `<option value="messaged"${stage==='messaged'?' selected':''}>Messaged on LinkedIn</option>` : ''}
        <option value="scheduled"${stage==='scheduled'?' selected':''}>Scheduled for Interview</option>
        <option value="shortlisted"${stage==='shortlisted'?' selected':''}>Interviewed &amp; Shortlisted</option>
        ${stage === 'messaged' ? `<option value="reject_not_fit">Not a fit (after messaging)</option>` : ''}
      </select>
    </div>`;

  if(stage === 'scheduled' || stage === 'shortlisted'){
    const dtValue = c.interviewDateTime ? c.interviewDateTime.slice(0,16) : '';
    html += `<div class="field-row">
      <div class="field">
        <label for="iv-dt-${c.id}">Interview date &amp; time</label>
        <input type="datetime-local" id="iv-dt-${c.id}" value="${escapeHtml(dtValue)}">
      </div>
      <div class="field" style="display:flex;align-items:flex-end;padding-bottom:9px;">
        <label class="checkbox-row" style="margin:0;" for="iv-confirmed-${c.id}">
          <input type="checkbox" id="iv-confirmed-${c.id}" ${c.interviewConfirmed ? 'checked' : ''}>
          Interview confirmed
        </label>
      </div>
    </div>
    <div class="stage-actions">
      <button class="ghost-btn" onclick="saveInterviewDetails('${c.id}')">Save interview details</button>`;
    if(stage === 'scheduled'){
      html += `<button class="ghost-btn" onclick="moveStage('${c.id}','shortlisted')">Move to Shortlisted</button>`;
    }
    html += `<button class="reject-btn" onclick="toggleInterviewRejectNote('${c.id}')">Reject after interview</button>
    </div>
    <div class="reject-note" id="irn-${c.id}">
      <textarea id="irn-text-${c.id}" placeholder="Optional reason for rejecting after interview"></textarea>
      <div class="mini-actions">
        <button class="mini-confirm" onclick="rejectAfterInterview('${c.id}')">Confirm reject</button>
        <button class="mini-cancel" onclick="toggleInterviewRejectNote('${c.id}')">Cancel</button>
      </div>
    </div>`;
  }

  if(stage === 'shortlisted'){
    html += `<div class="field-row">
      <div class="field">
        <label for="sc-file-${c.id}">Scorecard attachment</label>
        <input type="file" id="sc-file-${c.id}" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.xlsx,.csv">
        <div class="hint">${c.hasScorecard ? 'Currently has a scorecard' + (c.scorecardFileName ? ' — ' + escapeHtml(c.scorecardFileName) : '') + '. Choosing a new file replaces it.' : 'Under ~3.5MB.'}</div>
      </div>
      <div class="field">
        <label for="sc-by-${c.id}">Scored by</label>
        <input type="text" id="sc-by-${c.id}" value="${escapeHtml(c.scoredBy || '')}" placeholder="e.g. Sara, Hiring panel">
      </div>
    </div>
    <div class="field">
      <label for="sc-summary-${c.id}">Score summary</label>
      <textarea id="sc-summary-${c.id}" placeholder="Overall score / breakdown">${escapeHtml(c.scoreSummary || '')}</textarea>
    </div>
    <div class="stage-actions">
      <button class="ghost-btn" onclick="saveScorecard('${c.id}')">Save scorecard</button>
      ${c.hasScorecard ? `<button class="handled-btn" onclick="viewScorecard('${c.id}')">📎 View scorecard</button>` : ''}
    </div>`;
  }

  if(stage === 'approved'){
    html += `<div class="stage-actions">
      ${c.source === 'headhunting' ? `<button class="ghost-btn" onclick="moveStage('${c.id}','messaged')">Mark messaged on LinkedIn</button>` : ''}
      <button class="ghost-btn" onclick="moveStage('${c.id}','scheduled')">Move to Scheduled for Interview</button>
    </div>`;
  }

  if(stage === 'messaged'){
    html += `<div class="stage-actions">
      <button class="ghost-btn" onclick="moveStage('${c.id}','scheduled')">Move to Scheduled for Interview</button>
    </div>
    <div class="reject-note" id="nfm-${c.id}">
      <textarea id="nfm-text-${c.id}" placeholder="Optional reason (not a fit after messaging)"></textarea>
      <div class="mini-actions">
        <button class="mini-confirm" onclick="rejectNotFitAfterMessaging('${c.id}')">Confirm — not a fit</button>
        <button class="mini-cancel" onclick="cancelNotFitNote('${c.id}')">Cancel</button>
      </div>
    </div>`;
  }

  html += `</div>`;
  return html;
}

function toggleRejectNote(id){
  const el = document.getElementById('rn-' + id);
  if(el) el.classList.toggle('show');
}

/* ============ On hold (CEO) ============ */
function toggleHoldNote(id){
  const el = document.getElementById('hn-' + id);
  if(el) el.classList.toggle('show');
}

async function confirmHold(id){
  const el = document.getElementById('hn-text-' + id);
  const holdNote = el ? el.value.trim() : '';
  try{
    const res = await fetch('/candidates/' + id, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ onHold: true, holdNote })
    });
    if(!res.ok) throw new Error('Request failed: ' + res.status);
    showToast('Marked on hold');
    loadCandidates();
  }catch(e){
    showToast('Could not save — try again');
  }
}

async function removeHold(id){
  try{
    const res = await fetch('/candidates/' + id, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ onHold: false, holdNote: '' })
    });
    if(!res.ok) throw new Error('Request failed: ' + res.status);
    showToast('Hold removed');
    loadCandidates();
  }catch(e){
    showToast('Could not save — try again');
  }
}

/* ============ Edit candidate (HR) ============ */

}

async function submitEdit(id){

  const cvLink = document.getElementById('edit-cvlink-' + id).value.trim();

  const linkedinUrl = document.getElementById('edit-linkedin-' + id).value.trim();
  const source = editSources[id] || 'applied';
  const fileInput = document.getElementById('edit-cv-' + id);
  const msgEl = document.getElementById('edit-msg-' + id);
  const btn = document.getElementById('edit-submit-' + id);

  if(!name || !role){
    msgEl.innerHTML = '<div class="form-msg error">Name and role are required.</div>';
    return;
  }

  const file = fileInput.files[0];
  if(file && file.size > 3.6 * 1024 * 1024){

      headers: { 'Content-Type': 'application/json' },

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error('File read failed'));
    reader.readAsDataURL(file);
  });
}

/* ============ Duplicate detection (HR add form) ============ */
function describeCandidateState(c){
  if(c.archived) return 'closed/archived';
  if(c.status === 'rejected') return rejectionReasonLabel(c.rejectionReason).toLowerCase();
  if(c.status === 'pending') return c.onHold ? 'on hold (initial screening)' : 'in initial screening';
  if(c.status === 'approved'){
    if(c.stage === 'messaged') return 'messaged on LinkedIn';
    if(c.stage === 'scheduled') return 'scheduled for interview';
    if(c.stage === 'shortlisted') return 'interviewed & shortlisted';
    return 'approved for interview';
  }
  return c.status;
}

function checkDuplicateName(name){
  const warn = document.getElementById('dupWarningName');
  if(!warn) return;
  const trimmed = name.trim().toLowerCase();
  if(!trimmed){ warn.innerHTML = ''; return; }
  const match = candidates.find(c => c.name.trim().toLowerCase() === trimmed);
  warn.innerHTML = match
    ? `<div class="form-msg error">⚠ "${escapeHtml(match.name)}" is already on the board — currently ${escapeHtml(describeCandidateState(match))}.</div>`
    : '';
}

async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function checkDuplicateCv(input){
  const warn = document.getElementById('dupWarningCv');
  if(!warn) return;
  const file = input.files[0];
  if(!file){ warn.innerHTML = ''; return; }
  try{
    const base64 = await fileToBase64(file);
    const hash = await sha256Hex(base64);
    const match = candidates.find(c => c.cvHash === hash);
    warn.innerHTML = match
      ? `<div class="form-msg error">⚠ This exact CV was already uploaded for "${escapeHtml(match.name)}" — currently ${escapeHtml(describeCandidateState(match))}.</div>`
      : '';
  }catch(e){ /* duplicate check is best-effort — ignore failures */ }
}

      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ archived: true })
    });
    if(!res.ok) throw new Error('Request failed: ' + res.status);
    showToast('Archived — find it under the Archived tab');
    loadCandidates();
  }catch(e){
    showToast('Could not archive this entry — try again');
  }
}

async function restoreCandidate(id){
  try{
    const res = await fetch('/candidates/' + id, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ archived: false })
    });
    if(!res.ok) throw new Error('Request failed: ' + res.status);
    showToast('Restored');
    loadCandidates();
  }catch(e){
    showToast('Could not restore this entry — try again');
  }
}

function toggleDeleteConfirm(id){
  const el = document.getElementById('dc-' + id);
  if(el) el.classList.toggle('show');
}

async function permanentlyDelete(id){
  try{
    const res = await fetch('/candidates/' + id, { method: 'DELETE' });
    if(!res.ok) throw new Error('Request failed: ' + res.status);
    showToast('Deleted permanently');
    loadCandidates();
  }catch(e){
    showToast('Could not delete this entry — try again');
  }
}

/* ============ Init ============ */
window.addEventListener('DOMContentLoaded', loadRole);
window.addEventListener('focus', () => { if(currentRole && !editingId && !isTypingInNoteBox()) loadCandidates(); });
</script>
</body>
