<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fullstock HR: Email preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
.field-grid{display:grid;grid-template-columns:90px 1fr;gap:10px 14px;align-items:center;font-size:15px;}
.field-grid input{font:inherit;font-size:15px;padding:9px 12px;border:1px solid var(--border-strong);border-radius:8px;}
textarea#body{font:inherit;font-size:16px;line-height:1.5;padding:14px 16px;border:1px solid var(--border-strong);border-radius:8px;resize:vertical;width:100%;box-sizing:border-box;}
.attachment-pill{font-size:14px;padding:6px 12px;background:var(--active-bg);border-radius:999px;}
</style>
</head>
<body>

<header class="topbar">
  <img class="logo" src="img/fullstock-logo.png" alt="Fullstock">
  <nav aria-label="Main">
    <a href="home.html">Home</a>
    <a href="index.html">Recruitment</a>
    <a href="onboarding.html" class="active" aria-current="page">Onboarding</a>
  </nav>
  <div class="who">
    <span id="whoLabel">&nbsp;</span>
    <a href="#" id="logoutLink">Log out</a>
  </div>
</header>

<main style="max-width:900px;display:flex;flex-direction:column;gap:18px;">
  <a href="#" id="backLink" style="font-size:15px;padding:10px 0;align-self:flex-start;">← Back to the checklist</a>
  <div>
    <div id="itemLabel" style="font-size:14px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--link);"></div>
    <h1 id="emailTitle" style="margin:2px 0 0;font-size:32px;"></h1>
  </div>

  <section class="card" id="notSentPanel" style="padding:22px 24px;display:flex;flex-direction:column;gap:14px;">
    <div class="field-grid">
      <span style="color:var(--muted);">From</span><span>nesma.shalaby@fullstockeg.com (Outlook)</span>
      <label for="to" style="color:var(--muted);">To</label><input id="to" type="email" placeholder="candidate's personal email">
      <label for="subj" style="color:var(--muted);">Subject</label><input id="subj" type="text">
    </div>
    <label for="body" style="font-size:15px;color:var(--muted);">Message (filled in from the hire's details; edit before sending)</label>
    <textarea id="body" rows="14"></textarea>
    <div id="attachmentsRow" style="display:none;flex-wrap:wrap;gap:10px;align-items:center;">
      <span style="font-size:15px;color:var(--muted);">Attachments</span>
      <span class="attachment-pill">Fullstock New Hire Documents Checklist.pdf</span>
      <span class="attachment-pill" id="scheduleAttachment">First week at Fullstock.pdf</span>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;">
      <button type="button" class="btn ghost" id="copyBtn">Copy text</button>
      <a href="onboarding.html" class="btn secondary" id="cancelLink">Cancel</a>
      <button type="button" class="btn" id="sendBtn">Send from Outlook</button>
    </div>
  </section>

  <section class="card" id="sentPanel" style="display:none;background:var(--done-bg);border:none;padding:24px;flex-direction:column;gap:10px;">
    <div style="font-size:22px;font-weight:700;color:var(--done-fg);">Sent from your Outlook</div>
    <p style="margin:0;font-size:16px;" id="sentMsg"></p>
    <a href="#" id="backLink2" style="font-weight:700;padding:8px 0;align-self:flex-start;">Back to the checklist</a>
  </section>
</main>

<script src="shared.js"></script>
<script>
const TEMPLATE_KEY_BY_ITEM = {
  1: 'kpi_request', 3: 'laptop_sim', 5: 'welcome', 6: 'day_before', 8: 'team_announcement',
  18: 'month1_checkin', 19: 'month2_checkin', 20: 'eval_report_request', 23: 'feedback_survey',
};

function qs(name){ return new URLSearchParams(window.location.search).get(name); }
function formatDayDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  return dt.toLocaleDateString('en-US', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' }).replace(/^(\w+), /, '$1, ');
}
function fillPlaceholders(text, hire){
  const firstName = (hire.name || '').split(' ')[0];
  return text
    .split('[First name]').join(firstName)
    .split('[Role]').join(hire.role || '')
    .split('[Manager name]').join(hire.managerName || '(manager)')
    .split('[start date]').join(hire.startDate ? formatDayDate(hire.startDate) : '')
    .split('[day, date]').join(hire.startDate ? formatDayDate(hire.startDate) : '')
    .split('[Survey link]').join('[Survey link — paste the Jotform link from Templates]');
}

let hireId, itemId, item, hire;

async function boot(){
  if(!requireAccessKeyOrRedirect()) return;
  document.getElementById('whoLabel').textContent = currentUserLabel();

  hireId = qs('hireId');
  itemId = qs('itemId');
  document.getElementById('backLink').href = 'hire.html?id=' + hireId;
  document.getElementById('backLink2').href = 'hire.html?id=' + hireId;
  document.getElementById('cancelLink').href = 'hire.html?id=' + hireId;

  try{
    const [hireRes, templatesRes] = await Promise.all([
      apiFetch('/hires/' + hireId),
      apiFetch('/email-templates'),
    ]);
    if(!hireRes.ok) throw new Error('Request failed: ' + hireRes.status);
    hire = await hireRes.json();
    item = hire.checklist.items.find(i => i.id === itemId);
    if(!item){ document.body.innerHTML = '<p style="padding:40px;">Checklist item not found.</p>'; return; }

    document.getElementById('itemLabel').textContent = 'Checklist item ' + item.n;

    const templates = templatesRes.ok ? await templatesRes.json() : {};
    const key = TEMPLATE_KEY_BY_ITEM[item.n];
    const tpl = key ? templates[key] : null;
    const subject = tpl ? fillPlaceholders(tpl.subject, hire) : item.title;
    const body = tpl ? fillPlaceholders(tpl.body, hire) : '[No template is set up for this item yet.]';

    document.getElementById('emailTitle').textContent = tpl ? subject : item.title;
    document.getElementById('to').value = '';
    document.getElementById('subj').value = subject;
    document.getElementById('body').value = body;

    if(item.n === 5){
      document.getElementById('attachmentsRow').style.display = 'flex';
      document.getElementById('scheduleAttachment').textContent = 'First week at Fullstock - ' + hire.name + '.pdf';
    }

    if(item.done){
      showSent('Checklist item ' + item.n + ' was already marked done' + (item.doneBy ? ' by ' + item.doneBy : '') + '.');
    }
  }catch(e){
    showToast('Could not load this email — try again');
  }
}

function showSent(message){
  document.getElementById('notSentPanel').style.display = 'none';
  document.getElementById('sentPanel').style.display = 'flex';
  document.getElementById('sentMsg').textContent = message;
}

async function send(){
  const to = document.getElementById('to').value.trim();
  const subj = document.getElementById('subj').value;
  const body = document.getElementById('body').value;
  const mailto = 'mailto:' + encodeURIComponent(to) + '?subject=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(body);
  window.location.href = mailto;

  try{
    const res = await apiFetch('/checklist-items/' + itemId, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ done: true, actor: currentRole() === 'ceo' ? 'Reviewer' : 'HR' })
    });
    if(!res.ok) throw new Error('Request failed: ' + res.status);
    showSent('Checklist item ' + item.n + ' is ticked automatically, with today\'s date and your name.');
  }catch(e){
    showToast('Opened Outlook, but could not mark the item done — try ticking it on the checklist');
  }
}

async function copyText(){
  const subj = document.getElementById('subj').value;
  const body = document.getElementById('body').value;
  try{
    await navigator.clipboard.writeText('Subject: ' + subj + '\n\n' + body);
    showToast('Copied — paste it into Outlook');
  }catch(e){
    showToast('Could not copy — select the text manually');
  }
}

document.getElementById('sendBtn').addEventListener('click', send);
document.getElementById('copyBtn').addEventListener('click', copyText);
document.getElementById('logoutLink').addEventListener('click', (e) => { e.preventDefault(); clearAccessKey(); window.location.href = 'index.html'; });

boot();
</script>
</body>
</html>
